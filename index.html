<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metamorphosis</title>
<style>
:root{--bg:#05040e;--ink:#efeaff;--line:#6b5fa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05040e;--ink:#efeaff;--line:#6b5fa8}}
:root[data-theme="dark"]{--bg:#05040e;--ink:#efeaff;--line:#6b5fa8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
body{position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.ui{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;pointer-events:none}
#nm{font-size:clamp(26px,5vw,44px);letter-spacing:.04em;font-style:italic;transition:opacity .9s;opacity:.9}
#nm.off{opacity:0}
button{pointer-events:auto;font:16px system-ui,sans-serif;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:10px 20px;cursor:pointer;backdrop-filter:blur(6px)}
button:focus-visible{outline:2px solid #ffd27a;outline-offset:3px}
</style></head><body>
<canvas id="c" aria-label="Glowing particles that slowly transform between a lotus, a galaxy, a knot and a butterfly"></canvas>
<div class="ui"><div id="nm">Lotus</div><button id="bt">Transform</button></div>
<script>
const cv=document.getElementById('c'),X=cv.getContext('2d'),nm=document.getElementById('nm'),bt=document.getElementById('bt');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,dpr;
function fit(){dpr=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0);X.fillStyle='#05040e';X.fillRect(0,0,W,H)}
addEventListener('resize',fit);fit();
const N=innerWidth<700?4500:7500;
let sd=12345;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647,gs=()=>(rnd()+rnd()+rnd()-1.5)*1.6;
const shapes=[
{name:'Lotus',h:335,sp:75,gen:i=>{const u=(i+.5)/N,r=330*Math.sqrt(u),th=i*2.39996;return[r*Math.cos(th),60-Math.pow(r/330,1.5)*200+14*Math.sin(r*.05),r*Math.sin(th)]}},
{name:'Galaxy',h:195,sp:110,gen:i=>{if(rnd()<.12)return[gs()*60,gs()*40,gs()*60];const u=Math.pow(rnd(),.75),r=360*u+6,th=u*7+(i%3)*2.0944+gs()*.22*(1-u*.4);return[r*Math.cos(th),gs()*38*(1-u),r*Math.sin(th)]}},
{name:'Knot',h:28,sp:55,gen:()=>{const t=rnd()*6.2832,q=2+Math.cos(3*t);return[q*Math.cos(2*t)*100+gs()*24,-Math.sin(3*t)*100+gs()*24,q*Math.sin(2*t)*100+gs()*24]}},
{name:'Butterfly',h:150,sp:150,flap:1,gen:()=>{const t=rnd()*37.7,r=Math.exp(Math.sin(t))-2*Math.cos(4*t)+Math.pow(Math.sin((2*t-Math.PI)/24),5),k=.72+.28*rnd();return[Math.sin(t)*r*k*95,-Math.cos(t)*r*k*95+20,gs()*28]}}
];
shapes.forEach(s=>{s.tg=new Float32Array(N*3);for(let i=0;i<N;i++){const p=s.gen(i);s.tg.set(p,i*3)}});
const px=new Float32Array(N),py=new Float32Array(N),pz=new Float32Array(N),vx=new Float32Array(N),vy=new Float32Array(N),vz=new Float32Array(N),dl=new Float32Array(N);
for(let i=0;i<N;i++){const a=rnd()*6.28,b=rnd()*3.14,r=rnd()*30;px[i]=r*Math.sin(b)*Math.cos(a);py[i]=r*Math.cos(b);pz[i]=r*Math.sin(b)*Math.sin(a);
const v=200+rnd()*500;vx[i]=(rnd()-.5)*v;vy[i]=(rnd()-.5)*v;vz[i]=(rnd()-.5)*v;dl[i]=(i*.6180339%1)*1.3}
let si=0,pi=0,m=0,time=0,hc=shapes[0].h,spc=shapes[0].sp,ptr=null,drag=0,auto=0,paused=false;
const turbK=RM?.3:1;
function next(){pi=si;si=(si+1)%shapes.length;m=0;auto=0;nm.classList.add('off');setTimeout(()=>{nm.textContent=shapes[si].name;nm.classList.remove('off')},700)}
bt.onclick=next;cv.addEventListener('pointerdown',e=>{ptr=[e.clientX,e.clientY];next()});
cv.addEventListener('pointermove',e=>{ptr=[e.clientX,e.clientY]});cv.addEventListener('pointerleave',()=>ptr=null);
function step(dt){
 const cur=shapes[si],old=shapes[pi],tc=cur.tg,to=old.tg,fc=cur.flap?.62+.38*Math.cos(time*2.6):1,fo=old.flap?.62+.38*Math.cos(time*2.6):1;
 const turb=Math.exp(-m*1.1)*900*turbK+22;
 for(let i=0;i<N;i++){const j=i*3,useNew=m>dl[i],t=useNew?tc:to,f=useNew?fc:fo;
  const tx=t[j]*f,ty=t[j+1],tz=t[j+2];
  const w=useNew?(m-dl[i]<.6?1:0):0,tb=(m>dl[i]&&m<dl[i]+.9)?turb:22;
  const ax=(tx-px[i])*6-vx[i]*3+Math.sin(pz[i]*.011+time+i)*tb,
        ay=(ty-py[i])*6-vy[i]*3+Math.sin(px[i]*.011+time*1.1)*tb,
        az=(tz-pz[i])*6-vz[i]*3+Math.sin(py[i]*.011+time*.9+i*.3)*tb;
  vx[i]+=ax*dt;vy[i]+=ay*dt;vz[i]+=az*dt;px[i]+=vx[i]*dt;py[i]+=vy[i]*dt;pz[i]+=vz[i]*dt}}
function draw(){
 const k=Math.min(1,dt0*1.5);hc+=(shapes[si].h-hc)*k;spc+=(shapes[si].sp-spc)*k;
 X.globalCompositeOperation='source-over';X.fillStyle='rgba(5,4,14,.2)';X.fillRect(0,0,W,H);
 X.globalCompositeOperation='lighter';
 const cx=W/2,cy=H/2,g=X.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*.5);
 g.addColorStop(0,'hsla('+hc+',80%,50%,.07)');g.addColorStop(1,'hsla('+hc+',80%,50%,0)');X.fillStyle=g;X.fillRect(0,0,W,H);
 const ay=time*.22+drag,ax=.38,ca=Math.cos(ay),sa=Math.sin(ay),cb=Math.cos(ax),sb=Math.sin(ax),sc=Math.min(W,H)/760,F=900;
 for(let b=0;b<24;b++){X.fillStyle='hsla('+(hc+b/24*spc+Math.sin(time*.3)*14)+',88%,'+(62+8*Math.sin(b))+'%,.8)';
  for(let i=b;i<N;i+=24){const x1=px[i]*ca+pz[i]*sa,z1=-px[i]*sa+pz[i]*ca,y1=py[i]*cb-z1*sb,z2=py[i]*sb+z1*cb,f=F/(F+z2);
   let sx=cx+x1*f*sc,sy=cy+y1*f*sc;
   if(ptr){const dx=sx-ptr[0],dy=sy-ptr[1],d=Math.hypot(dx,dy);if(d<140&&d>.1){const p=(140-d)*(140-d)/140*.5;sx+=dx/d*p;sy+=dy/d*p}}
   const s=.8+1.5*f;X.fillRect(sx,sy,s,s)}}
 X.globalCompositeOperation='source-over'}
let last=performance.now(),dt0=.016;
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;dt0=dt;if(!paused){time+=dt;m+=dt;auto+=dt;if(!RM&&auto>9)next();step(dt)}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
